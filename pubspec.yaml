name: rentkaro
description: A self-drive vehicle rental application.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ----------------------------------------------------------
  # UI
  # ----------------------------------------------------------

  cupertino_icons: ^1.0.8

  # ----------------------------------------------------------
  # STATE MANAGEMENT
  # ----------------------------------------------------------

  flutter_riverpod: ^2.6.1
  riverpod: ^2.6.1
  hooks_riverpod: ^2.6.1

  # ----------------------------------------------------------
  # ROUTING
  # ----------------------------------------------------------

  go_router: ^17.5.0

  # ----------------------------------------------------------
  # NETWORKING
  # ----------------------------------------------------------

  dio: ^5.11.0
  http: ^1.6.0

  # ----------------------------------------------------------
  # STORAGE
  # ----------------------------------------------------------

  flutter_secure_storage: ^11.0.0
  shared_preferences: ^2.5.3

  # ----------------------------------------------------------
  # UI / FONTS
  # ----------------------------------------------------------

  google_fonts: ^6.3.1

  # ----------------------------------------------------------
  # UTILITIES
  # ----------------------------------------------------------

  equatable: ^2.1.0

  # ----------------------------------------------------------
  # IMAGES
  # ----------------------------------------------------------

  image_picker: ^1.2.0
  cached_network_image: ^3.4.1

  # ----------------------------------------------------------
  # LOCATION
  # ----------------------------------------------------------

  geolocator: ^14.0.3

  # ----------------------------------------------------------
  # MAP
  # ----------------------------------------------------------

  flutter_map: ^8.3.2
  latlong2: ^0.10.1

  # ----------------------------------------------------------
  # FIREBASE
  # ----------------------------------------------------------

  firebase_core: ^4.1.0

  # ----------------------------------------------------------
  # PAYMENTS
  # ----------------------------------------------------------

  razorpay_flutter: ^1.4.6

  # ----------------------------------------------------------
  # APP UPDATE
  # ----------------------------------------------------------

  package_info_plus: ^10.2.1
  url_launcher: ^6.3.2

# ============================================================
# DEVELOPMENT DEPENDENCIES
# ============================================================

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # ----------------------------------------------------------
  # APP ICON
  # ----------------------------------------------------------

  flutter_launcher_icons: ^0.14.4

# ============================================================
# FLUTTER
# ============================================================

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

# ============================================================
# FLUTTER LAUNCHER ICONS
# ============================================================

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/rentkaro_app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/rentkaro_app_icon.png"